{% extends 'dashboard_base.html' %}

{% block dashboard_content %}

<h3>System Reports</h3>

<ul class="list-group">
    <li class="list-group-item">Total Donors: {{ total_donors }}</li>
    <li class="list-group-item">Total Receivers: {{ total_receivers }}</li>
    <li class="list-group-item">Total Requests: {{ total_requests }}</li>
</ul>

<h4 class="mt-3">Stock</h4>
<table class="table">
{% for s in stock %}
<tr>
<td>{{ s.blood_group }}</td>
<td>{{ s.units }}</td>
</tr>
{% endfor %}
</table>

{% endblock %}
