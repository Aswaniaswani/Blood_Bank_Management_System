{% extends 'dashboard_base.html' %}

{% block dashboard_content %}
<h2>📦 Blood Stock Report</h2>

<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>Blood Group</th>
            <th>Available Units</th>
        </tr>
    </thead>
    <tbody>
        {% for stock in stocks %}
        <tr>
            <td>{{ stock.blood_group }}</td>
            <td>{{ stock.units }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2" class="text-center">No stock available</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<div class="mt-3">
    <a href="{% url 'add_blood' %}" class="btn btn-success">➕ Add Blood</a>
    <a href="{% url 'issue_blood' %}" class="btn btn-warning">➖ Issue Blood</a>
    <a href="{% url 'transaction_history' %}" class="btn btn-secondary">📜 Transactions</a>
</div>
{% endblock %}
